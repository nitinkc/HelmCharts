site_name: Helm + Flux GitOps Learning Path
site_description: A topic-based, hands-on Helm and Flux curriculum for GKE
repo_name: nitinkc/HelmCharts
repo_url: https://github.com/nitinkc/HelmCharts

theme:
  name: material
  features:
      # Navigation
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top           # Back-to-top button
    - navigation.footer        # Prev/Next page links
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate    # (1) style code annotations
    - content.tabs.link        # Sync tabs across page
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocs_quiz

nav:
  - Home: index.md
  - Getting Started:
      - Roadmap: getting-started/roadmap.md
      - Prerequisites: getting-started/prerequisites.md
      - Environment variables: getting-started/environment.md
      - Connect to GKE: getting-started/gke-connection.md
  - GitOps Fundamentals:
      - Concepts and architecture: fundamentals/concepts.md
      - Hands-on labs: fundamentals/labs.md
      - Knowledge check and Gate 1: fundamentals/assessment.md
  - Helm and OCI:
      - Core concepts: helm/concepts.md
      - Core labs: helm/labs.md
      - Templating and scope: helm/templating.md
      - Chart quality and security: helm/chart-quality.md
      - Interview labs: helm/interview-labs.md
      - Knowledge check and Gate 2: helm/assessment.md
  - Flux GitOps:
      - GKE integration: flux/gke-integration.md
      - GKE integration labs: flux/gke-labs.md
      - Reconciliation and release design: flux/reconciliation.md
      - Interview labs: flux/interview-labs.md
      - Knowledge check and Gate 3: flux/assessment.md
  - GitOps Operations:
      - Drift and recovery: operations/concepts.md
      - Hands-on labs: operations/labs.md
      - Knowledge check and Gate 4: operations/assessment.md
  - Interview Preparation:
      - Self-assessment quiz: interview/self-assessment.md
      - Question bank: interview/question-bank.md
      - Question model answers: interview/model-answers.md
      - Scenario drills: interview/scenario-drills.md
      - Scenario model solutions: interview/scenario-solutions.md
      - Capstone: interview/capstone.md
  - Solutions:
      - GitOps fundamentals: solutions/gitops-fundamentals.md
      - Advanced Helm and OCI: solutions/helm-oci.md
      - Flux on GKE: solutions/flux-gke.md
      - GitOps operations: solutions/gitops-operations.md
  - Reference:
      - Command cheat sheet: reference/commands.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
      - Cleanup: reference/cleanup.md
